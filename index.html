<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>بازی مار</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
    :root{color-scheme:dark;--bg:#0b1020;--panel:#111a2d;--muted:#8e9bb5;--lime:#a3e635;--cyan:#22d3ee;--line:#26334b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#172644 0,transparent 55%),var(--bg);color:#f4f7ff;font-family:'Vazirmatn',Tahoma,sans-serif;display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,580px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:#1d2c16;display:grid;place-items:center;font-size:25px;box-shadow:inset 0 0 0 1px #3e5d25}.brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.stats{display:flex;gap:10px}.stat{background:#121c30;border:1px solid var(--line);padding:7px 14px;border-radius:13px;text-align:center;min-width:76px}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:18px;color:var(--lime);line-height:1.3}
    .game-card{background:linear-gradient(145deg,#121c30,#0f1728);border:1px solid #26344d;border-radius:22px;padding:14px;box-shadow:0 24px 70px #0006}.board-wrap{position:relative;overflow:hidden;border-radius:14px;background:#0b1321;line-height:0}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08101bcc;backdrop-filter:blur(4px);text-align:center;padding:24px;line-height:1.6}.overlay.hidden{display:none}.overlay-box h2{margin:0 0 4px;font-size:26px}.overlay-box p{color:#a8b4ca;margin:0 0 16px;font-size:14px}.button{border:0;background:var(--lime);color:#18250b;border-radius:12px;padding:10px 22px;font:700 14px inherit;font-family:inherit;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}.button:hover{filter:brightness(1.08);transform:translateY(-1px)}.button.secondary{background:#202d43;color:#e5edf9;border:1px solid #35445d}.bar{display:flex;align-items:center;justify-content:space-between;padding:13px 4px 1px;color:var(--muted);font-size:12px}.bar .keys{display:flex;gap:6px;align-items:center}kbd{font:inherit;color:#d9e3f5;background:#1b2840;border:1px solid #33435f;border-radius:5px;padding:1px 6px}.actions{display:flex;gap:8px}.actions button{font:inherit;font-size:12px;padding:6px 12px;border-radius:9px}.mobile-controls{display:none;margin:16px auto 0;width:156px;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:6px;direction:ltr}.mobile-controls button{border:1px solid #33445f;background:#17243a;color:#e5edf9;border-radius:12px;font-size:20px;touch-action:manipulation}.mobile-controls button:active{background:#2a3b55}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.hint{text-align:center;margin:14px 0 0;color:#73819b;font-size:11px}
    @media(max-width:520px){body{padding:16px}.game-card{padding:10px;border-radius:18px}.stats{gap:6px}.stat{min-width:62px;padding:6px 9px}.brand h1{font-size:17px}.brand p{font-size:11px}.mobile-controls{display:grid}.bar .keys{display:none}.bar{justify-content:space-between}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="logo">🐍</div><div><h1>مارِ گرسنه</h1><p>تا می‌تونی سیب جمع کن!</p></div></div>
      <div class="stats"><div class="stat"><small>امتیاز</small><strong id="score">۰</strong></div><div class="stat"><small>رکورد</small><strong id="best">۰</strong></div></div>
    </header>
    <section class="game-card" aria-label="بازی مار">
      <div class="board-wrap">
        <canvas id="board" width="480" height="480" aria-label="صفحه بازی"></canvas>
        <div class="overlay" id="overlay"><div class="overlay-box"><h2 id="overlayTitle">آماده‌ای؟</h2><p id="overlayText">با خوردن سیب‌ها بزرگ‌تر شو، ولی به دیوار و خودت نخور!</p><button class="button" id="startBtn">شروع بازی</button></div></div>
      </div>
      <div class="bar"><span class="keys">حرکت: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> یا <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><div class="actions"><button class="button secondary" id="pauseBtn">توقف</button><button class="button secondary" id="restartBtn">شروع دوباره</button></div></div>
    </section>
    <div class="mobile-controls" aria-label="دکمه‌های حرکت"><button class="up" data-dir="up" aria-label="بالا">↑</button><button class="left" data-dir="left" aria-label="چپ">←</button><button class="down" data-dir="down" aria-label="پایین">↓</button><button class="right" data-dir="right" aria-label="راست">→</button></div>
    <p class="hint">برای مکث، کلید فاصله را بزن</p>
  </main>
<script>
(() => {
  const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),N=20,CELL=canvas.width/N;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),text=document.getElementById('overlayText'),startBtn=document.getElementById('startBtn');
  const fa=n=>new Intl.NumberFormat('fa-IR').format(n);
  let snake,food,dir,nextDir,score,best=Number(localStorage.getItem('snake-best')||0),timer=null,state='ready';
  bestEl.textContent=fa(best);
  function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=fa(score);placeFood();draw()}
  function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function draw(){ctx.fillStyle='#0b1321';ctx.fillRect(0,0,480,480);ctx.strokeStyle='rgba(129,155,190,.055)';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(480,i*CELL);ctx.stroke()}
    // Apple
    const fx=(food.x+.5)*CELL,fy=(food.y+.53)*CELL;ctx.shadowColor='#fb7185';ctx.shadowBlur=18;ctx.fillStyle='#fb536b';ctx.beginPath();ctx.arc(fx,fy, CELL*.33,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#a3e635';ctx.beginPath();ctx.ellipse(fx+4,fy-9,5,2.5,-.55,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a3e635';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx,fy-7);ctx.lineTo(fx+1,fy-12);ctx.stroke();
    snake.forEach((s,i)=>{const pad=2.3;ctx.fillStyle=i===0?'#bef264':'#84cc16';ctx.shadowColor=i===0?'#a3e635':'transparent';ctx.shadowBlur=i===0?10:0;roundedRect(s.x*CELL+pad,s.y*CELL+pad,CELL-pad*2,CELL-pad*2,6);ctx.shadowBlur=0;if(i===0){ctx.fillStyle='#263713';const ex=fxEye(dir,true,s),ey=fxEye(dir,false,s);ctx.beginPath();ctx.arc(ex,ey,1.8,0,Math.PI*2);ctx.arc(ex+(dir.x===0?7:0),ey+(dir.y===0?7:0),1.8,0,Math.PI*2);ctx.fill()}})
  }
  function fxEye(d,vertical,s){return (s.x+.5)*CELL+(d.x===0?(vertical?-4:4):d.x*5)}
  function tick(){dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=fa(score);if(score>best){best=score;bestEl.textContent=fa(best);localStorage.setItem('snake-best',best)}placeFood()}else snake.pop();draw()}
  function start(){if(state==='running')return;reset();state='running';overlay.classList.add('hidden');clearInterval(timer);timer=setInterval(tick,125)}
  function pause(){if(state==='running'){state='paused';clearInterval(timer);show('بازی متوقف شد','هر وقت آماده‌ای ادامه بده.','ادامه بازی')}else if(state==='paused'){state='running';overlay.classList.add('hidden');timer=setInterval(tick,125)}}
  function show(t,m,b){title.textContent=t;text.textContent=m;startBtn.textContent=b;overlay.classList.remove('hidden')}
  function end(){clearInterval(timer);state='over';show('بازی تموم شد!','امتیازت: '+fa(score)+' — یه بار دیگه تلاش می‌کنی؟','دوباره بازی کن')}
  const map={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
  function turn(x,y){if(x!==-dir.x||y!==-dir.y){nextDir={x,y};if(state==='ready'||state==='over')start()}}
  document.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();turn(...map[e.key])}else if(e.code==='Space'){e.preventDefault();pause()}});
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>{const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};turn(...dirs[b.dataset.dir])}));
  startBtn.addEventListener('click',()=>state==='paused'?pause():start());document.getElementById('pauseBtn').addEventListener('click',pause);document.getElementById('restartBtn').addEventListener('click',start);reset();
})();
</script>
</body>
</html>
